  <style>
    /* Box ကိုလှစေဖို့ */
.box {
  width: 800px;  
   height: 480px;        /* Box အကျယ် */
  margin: 40px auto;       /* အလယ်မှာထားရန် */
  padding: 25px 20px;      /* အတွင်းpadding */
    background-color: #f7f2f0;
  border-radius: 15px;     /* အနားတွေကိုထောင့်ကွေး */
  box-shadow: 0 8px 20px rgba(0,0,0,0.15); /* နေရာကွယ်အရောင်ထိုး */
  text-align: center;      /* စာလုံးတွေကိုအလယ်သို့ */
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* နူးညံ့စာလုံး */
  transition: transform 0.3s ease; /* hover effect နေရာ */
}

/* Hover လုပ်တဲ့အခါ animation */
.box:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 25px rgba(0,0,0,0.2);
}

/* Heading ကိုလှစေ */
.box h2 {
  font-size: 40px;
  margin-bottom: 15px;
  color: #ff6b6b; /* လှပတဲ့ အနီရောင် */
}

/* Paragraph style */
.box p {
  font-size: 30px;
  margin: 8px 0;
  color: #333;
}
  </style>
