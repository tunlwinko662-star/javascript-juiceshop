<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <title>Fresh Juice - Admin Panel</title>
  <link rel="stylesheet" href="style.css">
  <style>
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #333; color: #fff; }
    tr:nth-child(even) { background: #f9f9f9; }
    .section { margin-bottom: 40px; }
    button.clear-btn { margin-top: 15px; background: red; color: white; border: none; padding: 8px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>🥤 Fresh Juice Shop</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <main>
    <!-- Login Section -->
    <div id="login-section" class="section">
      <h2>Admin Login</h2>
      <input type="password" id="admin-password" placeholder="Enter Password">
      <button onclick="login()">Login</button>
      <p id="login-message" style="color:red; margin-top:10px;"></p>
    </div>
    

    <!-- Admin Section (hidden until login) -->
<div id="admin-section" style="display:none;">

  <!-- Orders Section ကို အပေါ်မှာ -->
  <h2>📦 Customer Orders</h2>
  <table>
    <thead>
      <tr>
        
        <th>Table No</th>
        <th>Items</th>
        <th>Total (Ks)</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="orders-body"></tbody>
  </table>
  <button class="clear-btn" onclick="clearOrders()">🗑 Clear All Orders</button><br><br><br><br>

  <!-- Drinks Management ကို အောက်မှာ -->
  <h2>🍹 Add New Drink</h2>
  <form id="drink-form" class="tt">
    <input type="text" id="name" placeholder="ဖျော်ရည်အမည်" required>
    <input type="text" id="price" placeholder="ဈေးနှုန်း" required>
    <input type="text" id="image" placeholder="Image URL" required>
    <button type="submit">ထည့်မယ်</button>
  </form>

  <h2>📋 Drink List</h2>
  <div id="admin-list" class="menu-grid"></div>

  </main>

  <footer>
    <p>© 2025 Fresh Juice Shop</p>
  </footer>

  <script src="admin.js"></script>
  
  </script>
</body>
</html>
